[project]
name = "drugiq-atlas-runtime"
version = "0.1.0"
description = "Private DrugIQ single-variant Atlas API runtime"
requires-python = "~=3.12.0"
dependencies = [
    "alphagenome==0.9.0",
    "anndata==0.13.3.post0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "grpcio==1.83.1",
    "protobuf==7.36.1",
]

[tool.uv]
package = false
# These SDK extras are not used by AtlasClient query_variant/scorer_metadata.
# No SDK source, numerical dependency, transport or score converter is removed.
# Both full-SDK and reduced-runtime contract tests run in GitHub Actions.
exclude-dependencies = ["matplotlib", "seaborn", "pyarrow"]
